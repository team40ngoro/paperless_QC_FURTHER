services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperless-fp-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8001
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST_docker}
      DB_PORT: ${DB_PORT_docker}
      DB_DATABASE: ${DB_DATABASE_docker}
      DB_USERNAME: ${DB_USERNAME_docker}
      DB_PASSWORD: ${DB_PASSWORD_docker}
    volumes:
      - ./:/var/www
    networks:
      - shared-network

  nginx:
    image: nginx:alpine
    container_name: paperless-fp-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shared-network

networks:
  shared-network:
    external: true
